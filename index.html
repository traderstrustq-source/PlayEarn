<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play & Earn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0f1e;--card:#141e35;--accent:#00d4ff;--gold:#ffcc00;--text:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:var(--text)}
.header{padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #1e3a5f;position:sticky;top:0;background:#0a0f1e;z-index:9}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.nav button{background:#141e35;color:#fff;border:1px solid #1e3a5f;padding:10px;border-radius:14px}
.nav button.active{background:#00d4ff;color:#000;font-weight:800}
.screen{padding:16px;display:none} .screen.active{display:block}
.card{background:#141e35;border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid #1e3a5f}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.game{background:linear-gradient(135deg,#1a2a4a,#0f1e38);border-radius:18px;padding:14px;text-align:center;border:1px solid #2a4a7a}
.btn{width:100%;background:#00d4ff;color:#000;font-weight:800;border:none;padding:12px;border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<div class="header"><b>🎮 PLAY & EARN <span style="font-size:10px">*** Coins</span></b><div id="bal" style="color:#ffcc00;font-weight:800">0 coins</div></div>
<div class="nav">
<button onclick="showScreen('home')" id="b-home" class="active">Home</button>
<button onclick="showScreen('games')" id="b-games">Games</button>
<button onclick="showScreen('wallet')" id="b-wallet">Wallet</button>
<button onclick="showScreen('profile')" id="b-profile">Profile</button>
</div>
<div id="home" class="screen active"><div class="card" style="background:linear-gradient(135deg,#00d4ff,#7b61ff)"><h3>💎 1$ = 100 coins</h3><p>50⭐ = 1$ → 1⭐ = 2 coins</p><button class="btn" onclick="showScreen('wallet')" style="background:#ffcc00">Deposit Now</button></div><div class="card">👥 Refer: <b id="refLink" style="font-size:11px"></b><br><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('refLink').innerText);alert('Copied')">Share</button></div><div class="card">🏆 Leaderboard<div id="lb">🥇 You — 0</div></div></div>
<div id="games" class="screen"><div class="card"><b>🎮 12 GAMES</b></div><div class="games" id="grid"></div></div>
<div id="wallet" class="screen"><div class="card"><h3>💰 Wallet</h3><div id="winfo"></div></div><div class="card"><button class="btn" onclick="depositStars(50)">⭐ 50⭐ → 100 coins</button><button class="btn" style="background:#1a3a5a;color:#fff" onclick="alert('UPI: demo@upi')">Manual UPI</button></div><div class="card"><input id="wdAmt" placeholder="Coins e.g. 500" style="width:100%;padding:10px;border-radius:10px;border:none"><input id="wdInfo" placeholder="UPI/TRC20" style="width:100%;padding:10px;border-radius:10px;border:none;margin-top:8px"><button class="btn" style="background:#ffcc00" onclick="withdraw()">Withdraw</button></div></div>
<div id="profile" class="screen"><div class="card" id="pinfo"></div><div class="card"><input id="supMsg" placeholder="Message admin" style="width:100%;padding:10px;border-radius:10px;border:none"><button class="btn" onclick="sendSupport()">Send</button></div></div>
<div id="play" class="screen"><div class="card" id="playCard"></div><button class="btn" style="background:#333;color:#fff" onclick="showScreen('games')">Back</button></div>
<script>
var tg = window.Telegram ? window.Telegram.WebApp : null; if(tg){tg.ready();tg.expand();}
var uid = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 123456;
var WEBHOOK = "https://api.telebotcreator.com/new-webhook?data=TBCSECRET_secret_4bc286da";
var balance = 20; var cpd=100, cps=2;
function updateBal(){
  document.getElementById('bal').innerHTML = balance.toFixed(0)+' coins';
  document.getElementById('winfo').innerHTML = '🪙 '+balance.toFixed(0)+' coins ≈ $'+(balance/cpd).toFixed(2);
  document.getElementById('pinfo').innerHTML = 'ID: '+uid+'<br>Balance: '+balance.toFixed(0);
  document.getElementById('lb').innerHTML = '🥇 You — '+balance.toFixed(0);
  document.getElementById('refLink').innerText = 'https://t.me/Playearn1millionbot?start='+uid;
}
window.showScreen = function(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  var btn=document.getElementById('b-'+id); if(btn) btn.classList.add('active');
}
var gamesList=[{id:'miner',name:'Miner',e:'⛏️',m:1.8},{id:'wheel',name:'Wheel',e:'🎰',m:2},{id:'gem',name:'Gem',e:'💎',m:2.5},{id:'number',name:'Number',e:'🧩',m:2.2},{id:'snake',name:'Snake',e:'🐍',m:2.8},{id:'quiz',name:'Quiz',e:'🏆',m:2},{id:'treasure',name:'Treasure',e:'🗝️',m:3},{id:'coin',name:'Flip',e:'🪙',m:2},{id:'dice',name:'Dice',e:'🎲',m:5},{id:'crash',name:'Crash',e:'🚀',m:1.9},{id:'ludo',name:'Ludo',e:'🎲',m:5},{id:'tap',name:'Tap',e:'💨',m:2}];
var grid=document.getElementById('grid');
gamesList.forEach(g=>{
  var d=document.createElement('div'); d.className='game';
  d.innerHTML='<div style="font-size:28px">'+g.e+'</div><b>'+g.name+'</b><br>'+g.m+'x';
  d.onclick=function(){openGame(g.id)}; grid.appendChild(d);
});
var currentBet=0, hidden=0, activeGame='';
window.openGame=function(id){
  var g=gamesList.find(x=>x.id===id); activeGame=id;
  document.getElementById('playCard').innerHTML='<h3>'+g.name+' '+g.m+'x</h3><p>Balance: '+balance.toFixed(0)+'</p><div style="display:flex;gap:6px"><button class="btn" onclick="setBet(5)">5</button><button class="btn" onclick="setBet(10)">10</button><button class="btn" onclick="setBet(25)">25</button></div><input id="cBet" placeholder="Custom" style="width:100%;padding:10px;border-radius:10px;border:none;margin-top:8px"><button class="btn" onclick="setBet(parseInt(document.getElementById(\'cBet\').value)||0)">Lock</button><div id="area" style="margin-top:12px"></div>';
  showScreen('play');
}
window.setBet=function(v){
  if(v<1||v>balance){alert('Invalid');return;}
  currentBet=v; hidden=Math.floor(Math.random()*3);
  var a=document.getElementById('area');
  if(activeGame==='gem') a.innerHTML='<button class="btn" onclick="playGame(0)">Box1</button><button class="btn" onclick="playGame(1)">Box2</button><button class="btn" onclick="playGame(2)">Box3</button>';
  else if(activeGame==='coin') a.innerHTML='<button class="btn" onclick="playGame(\'head\')">HEAD</button><button class="btn" onclick="playGame(\'tail\')">TAIL</button>';
  else a.innerHTML='<button class="btn" onclick="playGame(0)">PLAY</button>';
}
window.playGame=function(pick){
  var win=Math.random()<0.45;
  if(win) balance+=currentBet*2; else balance-=currentBet;
  updateBal(); 
  fetch(WEBHOOK+'&user_id='+uid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'bet',game:activeGame,bet:currentBet,pick:pick,win:win})}).catch(function(){});
  alert(win?'WIN +'+(currentBet*2):'Lose -'+currentBet); showScreen('games');
}
window.depositStars=function(s){
  fetch(WEBHOOK+'&user_id='+uid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'deposit_stars',stars:s})}).catch(function(){});
  alert('Invoice sent in bot chat');
}
window.withdraw=function(){
  var a=parseFloat(document.getElementById('wdAmt').value), i=document.getElementById('wdInfo').value;
  fetch(WEBHOOK+'&user_id='+uid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'withdraw',amount:a,info:i})}).catch(function(){});
  alert('Requested');
}
window.sendSupport=function(){
  var m=document.getElementById('supMsg').value;
  fetch(WEBHOOK+'&user_id='+uid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'support',msg:m})}).catch(function(){});
  alert('Sent');
}
updateBal();
console.log('Mini App loaded OK');
</script>
</body>
</html>
